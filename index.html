<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎰 Gacha Singularity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>🎰 Gacha Singularity</h1>

<img class="banner" src="https://files.catbox.moe/i1ldc8.png">

<div class="progress-box">
  <div id="progress"></div>
</div>

<div class="stats">
  <p>🎖️ Lv <span id="lvl">1</span></p>
  <p>💰 <span id="point">0</span>/5000</p>
  <p>🎟️ <span id="spinCount">0</span></p>
</div>

<div class="btn-group">
  <button class="btn spin" onclick="spin(1)">🎰 SPIN</button>
  <button class="btn spin10" onclick="spin(10)">💥 x10</button>
</div>

<h3>🎯 Misi</h3>
<div id="missionList"></div>

<button class="btn daily" onclick="daily()">🎁 Daily</button>
<button id="claim" class="btn claim" onclick="claim()">🎁 Mystery Box</button>

<h3>🎴 Inventory</h3>
<div id="inventory"></div>

<h3>🏆 Leaderboard</h3>
<div id="lb"></div>

</div>

<script src="script.js"></script>
</body>
</html>
