<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎰 Gacha Singularity</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🎰 Gacha Singularity</h1>

<button onclick="login()">👤 Login</button>

<div class="stats">
<p>💰 <span id="point">0</span>/5000</p>
<p>🎟️ <span id="spinCount">0</span></p>
</div>

<div class="progress-box">
<div id="progress"></div>
</div>

<button onclick="spin(1)">🎰 Spin</button>
<button onclick="spin(10)">💥 Spin x10</button>

<h3>🎯 Misi</h3>
<div id="missionList"></div>

<button onclick="daily()">🎁 Daily</button>
<button id="claim" onclick="claim()">🎁 Claim</button>

<h3>🎴 Inventory</h3>
<div id="inventory"></div>

<h3>🏆 Leaderboard</h3>
<div id="lb"></div>

</div>

<script src="script.js"></script>
</body>
</html>
